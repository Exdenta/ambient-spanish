name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/ambient-lookup
      - run: cargo clippy --manifest-path rust/ambient-lookup/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/ambient-lookup/Cargo.toml

  hover-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Plugin tests and validation run locally and need no login. The version is
      # pinned so CI does not change under us; bump it on purpose.
      - run: npm install -g @anthropic-ai/claude-code@2.1.292
      - run: claude plugin validate mods/ambient-spanish-hover
      - run: claude plugin test mods/ambient-spanish-hover
